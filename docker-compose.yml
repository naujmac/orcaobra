services:
  postgres:
    image: postgres:17-alpine
    container_name: orcaobra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orcaobra
      POSTGRES_PASSWORD: orcaobra_dev
      POSTGRES_DB: orcaobra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
